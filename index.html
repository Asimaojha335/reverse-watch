<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A countdown timer with presets and a sound alert, built with HTML, CSS, JavaScript and Bootstrap.">
  <title>Reverse Watch</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%8F%B3%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.setAttribute("data-bs-theme",t)}catch(e){}</script>
</head>
<body>
  <div class="bg-orbs" aria-hidden="true"><span></span><span></span></div>

  <main class="shell">
    <header class="top">
      <div>
        <p class="eyebrow">Time tools</p>
        <h1>Reverse Watch</h1>
      </div>
      <button id="themeBtn" class="icon-btn" type="button" aria-label="Toggle dark mode">
        <svg class="sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </header>

    <section class="panel">
      <div class="dial" id="dial">
        <svg viewBox="0 0 200 200" aria-hidden="true">
          <circle class="track" cx="100" cy="100" r="90"/>
          <circle class="arc" id="ring" cx="100" cy="100" r="90" pathLength="100"/>
        </svg>
        <div class="readout">
          <div id="display" class="time" role="timer" aria-live="off">05:00</div>
          <div id="status" class="status">Set your time</div>
        </div>
      </div>

      <p id="message" class="msg" role="status"></p>

      <div class="presets" role="group" aria-label="Quick presets">
        <button class="chip" type="button" data-seconds="60">1 min</button>
        <button class="chip" type="button" data-seconds="300">5 min</button>
        <button class="chip" type="button" data-seconds="600">10 min</button>
        <button class="chip" type="button" data-seconds="1500">25 min</button>
      </div>

      <form id="setForm" class="time-inputs" novalidate>
        <div>
          <label for="hours">Hours</label>
          <input id="hours" type="number" inputmode="numeric" class="form-control" min="0" max="99" value="0">
        </div>
        <div>
          <label for="minutes">Minutes</label>
          <input id="minutes" type="number" inputmode="numeric" class="form-control" min="0" max="59" value="5">
        </div>
        <div>
          <label for="seconds">Seconds</label>
          <input id="seconds" type="number" inputmode="numeric" class="form-control" min="0" max="59" value="0">
        </div>
      </form>

      <div class="controls two">
        <button id="resetBtn" class="btn btn-outline-secondary btn-lg" type="button">Reset</button>
        <button id="startBtn" class="btn btn-brand btn-lg" type="button">Start</button>
      </div>
      <p class="hint"><kbd>Space</kbd> start / pause &nbsp; <kbd>R</kbd> reset</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
